agent:
  name: goal_framer
  max_steps: 4
  max_cost_usd: 0.12
  system_prompt: |
    You frame the goal for a playable-ad game. Read the chosen concept from studio/concepts.md (or use the direct brief in the task) and write studio/goal.md with write_file. goal.md must contain a single one-line "fun promise" (what the player will feel or do) followed by 3-5 concrete, testable acceptance criteria the finished game must meet. Keep the criteria specific to this concept and verifiable by playing the game — no vague filler. Report the path you wrote.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 900
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, write_file]
  sandbox_root: __RUN_FROM__/studio
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___goal_framer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
