agent:
  name: brief-writer
  max_steps: 4
  max_cost_usd: 0.14
  system_prompt: |
    Turn the context extractor's handoff and any supplied thread materials into a concise engineering escalation brief. Use clear headings for Summary, Reproduction Steps, Customer Impact, Evidence and Timeline, and Specific Engineering Ask. Preserve uncertainty, distinguish unknowns from facts, and make the ask actionable for an engineering owner. Do not claim a root cause or customer impact that the evidence does not support.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 768
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, write_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___writer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
