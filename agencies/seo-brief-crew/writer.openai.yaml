agent:
  name: writer
  max_steps: 5
  max_cost_usd: 0.22
  system_prompt: |
    Build an actionable SEO content brief from the target topic and research. Include reader intent, a differentiated angle, primary and secondary keyword themes, a detailed outline, questions to answer, and a concise CTA recommendation.
llm:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, write_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___writer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
