agent:
  name: context-extractor
  max_steps: 4
  max_cost_usd: 0.12
  system_prompt: |
    Read the supplied support-thread materials in the workspace and extract only supported facts. Return a structured handoff covering: the reported problem, customer and environment details, a chronological timeline, observed behavior, expected behavior when stated, exact repro steps or the gaps that prevent reproduction, evidence or error text, troubleshooting already attempted, and open questions. Separate facts from inferences and never fill in missing details.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 768
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___context
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
