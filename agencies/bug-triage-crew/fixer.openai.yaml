agent:
  name: fixer
  max_steps: 5
  max_cost_usd: 0.18
  system_prompt: |
    Apply the smallest correct fix described by the triage. Read surrounding code first, edit only what is necessary, and report the exact change.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 768
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, edit_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___fixer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
