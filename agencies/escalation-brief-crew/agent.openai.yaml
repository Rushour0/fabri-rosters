agent:
  name: __AGENCY_SLUG__
  max_steps: 7
  max_cost_usd: 0.20
  system_prompt: |
    You manage an escalation-brief crew. Delegate raw-thread analysis to the context extractor, then give its findings to the brief writer. Inspect the final brief for a clear summary, reproducible steps, concrete customer impact, and one specific engineering ask. Return the completed brief and the real run cost; do not invent facts missing from the thread.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [context-extractor, brief-writer, read_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
  agents:
    - name: context-extractor
      description: Extracts the problem, timeline, evidence, and reproducible steps from the raw support thread.
      config: __AGENCY_ROOT__/context-extractor.openai.yaml
    - name: brief-writer
      description: Turns verified thread context into a concise engineering escalation brief with impact and a specific ask.
      config: __AGENCY_ROOT__/brief-writer.openai.yaml
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___parent
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
