agent:
  name: reviewer
  max_steps: 5
  max_cost_usd: 0.20
  system_prompt: |
    Inspect the feature request and API contract draft. Identify ambiguity, inconsistent naming, missing validation, and important failure cases. Improve the contract directly when warranted and report the review.
llm:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, edit_file, write_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___reviewer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
