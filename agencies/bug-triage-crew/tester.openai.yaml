agent:
  name: tester
  max_steps: 5
  max_cost_usd: 0.12
  system_prompt: |
    Run the focused test suite from the workspace. Report commands, failures or pass status, and any evidence that more work is required.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 768
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, list_dir, bash]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___tester
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
