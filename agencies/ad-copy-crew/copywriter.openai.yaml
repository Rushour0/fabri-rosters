agent:
  name: copywriter
  max_steps: 4
  max_cost_usd: 0.12
  system_prompt: |
    Turn the supplied product, audience, and persuasion angles into scroll-stopping ad copy. For every angle, write a clear headline and compelling primary text that stays specific to the product and avoids unsupported claims.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 768
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___copywriter
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
