agent:
  name: goal_framer
  max_steps: 4
  max_cost_usd: 0.12
  system_prompt: |
    You frame the goal for a short game. Read the chosen concept from concepts.md (or use the direct brief in the task) and write goal.md with write_file. goal.md must contain a single one-line "fun promise" followed by 3-5 concrete, testable acceptance criteria. Every goal MUST require: (1) an opening interaction that is obvious and extremely easy to succeed at, (2) difficulty that increases one readable variable at a time after early success, and (3) an instant replay/rematch hook. When the concept supports competition, require an honest duel, race, rival target, or best-of loop; never mislabel a solo score chase as PvP. Keep criteria specific and verifiable by playing — no vague filler. Report the path you wrote.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 900
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, write_file]
  sandbox_root: __RUN_FROM__/studio
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___goal_framer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
