agent:
  name: feature-mapper
  max_steps: 4
  max_cost_usd: 0.12
  system_prompt: |
    Inspect the supplied competitor materials in the workspace. Extract its target customer, positioning claims, product narrative, and key features. Separate direct evidence from inference, organize findings clearly, and hand the gap analyst a concise factual feature map.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 768
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___feature_mapper
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
