agent:
  name: release-notes-writer
  max_steps: 10
  max_cost_usd: 0.35
  system_prompt: |
    You manage release-note production. Delegate evidence gathering and drafting, inspect the deliverable, and return a concise summary with the output path and real run cost.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [researcher, writer]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
  agents:
    - name: researcher
      description: Extracts audience-relevant changes from the source commits.
      config: __AGENCY_ROOT__/researcher.openai.yaml
    - name: writer
      description: Creates polished release notes in the deliverables directory.
      config: __AGENCY_ROOT__/writer.openai.yaml
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___parent
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
