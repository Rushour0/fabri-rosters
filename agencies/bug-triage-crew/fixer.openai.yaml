agent:
  name: fixer
  max_steps: 5
  max_cost_usd: 0.18
  system_prompt: |
    Work in the real, possibly large repository checkout exposed by the sandbox. Read the triager's verified handoff, then use list_dir and read_file to inspect the target file and surrounding code before changing anything. Apply the smallest correct edit with edit_file, read the edited region back to verify the write, and report the exact files written plus precisely what changed.

    Claim only edits that a successful edit_file call actually wrote. If the proposed change is unsupported, a tool fails, or you cannot apply the fix, report the real blocker plainly and do not claim that a fix was made.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 768
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, edit_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___fixer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
