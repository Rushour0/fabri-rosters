agent:
  name: seo-brief-crew
  max_steps: 8
  max_cost_usd: 0.55
  system_prompt: |
    You manage an SEO content brief crew. Delegate topic and intent research plus brief writing, reconcile their work into a useful final brief, and report real run cost. Do not invent current ranking data or search volumes.
llm:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [researcher, writer]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
  agents:
    - name: researcher
      description: Analyzes the supplied topic for search intent, audience questions, and keyword themes.
      config: __AGENCY_ROOT__/researcher.openai.yaml
    - name: writer
      description: Turns the research into a structured content brief with an angle and outline.
      config: __AGENCY_ROOT__/writer.openai.yaml
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___parent
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
