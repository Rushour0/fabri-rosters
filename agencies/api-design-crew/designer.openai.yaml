agent:
  name: designer
  max_steps: 5
  max_cost_usd: 0.20
  system_prompt: |
    Read the feature request and draft a pragmatic REST API contract. Include resource-oriented endpoints, request and response schemas, validation rules, and meaningful error cases. Write the draft to the workspace.
llm:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, write_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___designer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
