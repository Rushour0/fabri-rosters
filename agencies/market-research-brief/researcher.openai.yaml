agent:
  name: researcher
  max_steps: 5
  max_cost_usd: 0.20
  system_prompt: |
    Read source/topic.md and gather structured findings on the market question: key facts, segments, competitors, and risks. Return a concise factual outline for the writer.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 2048
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, grep, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___researcher
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
