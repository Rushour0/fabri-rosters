[company]
name = "playable-ad-studio"
title = "Playable Ad Studio"
positioning = "Turns a game brief into a validated, deployable freeform playable-ad HTML game for engines/web — idea to design to build to QA to deploy-gate to catalog metadata — at a known cost."
max_cost_usd = 4.00
memory_namespace = "playable_ad_studio"
# A manager waits for its whole subtree; the CEO->director->crew->specialist
# chain needs far more than the 120s single-agent default. Injected into every
# manager child-call at compile time.
#
# 2400, not 1200: a full prod run measured ~1091s against the old 1200s ceiling,
# leaving ~9% margin — so a normal-length build was a coin flip, and with the
# single-agent fallback off (v0.18.52) losing that flip returns nothing at all.
# This is a stopgap that buys headroom, not a fix: the real problem is that one
# short game takes ~18 minutes. That needs less company work or a bigger box.
call_timeout_s = 2400

[[node]]
id = "ceo"
report_to = ""
title = "Studio Head"
prompt = """
You run Playable Ad Studio. Your crews all share one working directory ('studio') that flows files between them. Produce ONE finished, deployable freeform short game from the brief. Product bar: the first interaction is stupid-easy and rewarding, then difficulty rises one readable step at a time. Prefer honest competitive hooks (duel, race, rival score, best-of rematch) when they fit; never call a solo loop PvP. Delegate IN THIS ORDER and pass the shared paths explicitly:
1. Creative Director → concepts (concepts.md) then the chosen design (design.json, validated) + goal (goal.md).
2. Production Director → build the game (build/<slug>/index.html), QA it (qa-report.md), and run the deploy gate (verify.json). <slug> is design.json's slug.
3. Release Director → catalog metadata (build/<slug>/_meta.toml).
Finish ONLY when the deploy gate (verify.json) reports ok=true. If it fails, send the repair guidance back to the Production Director to rebuild, then re-verify. Return one concise summary: the game slug, the index.html path, the deploy-gate verdict, and the total run cost.
"""

[[node]]
id = "creative_director"
report_to = "ceo"
title = "Creative Director"
prompt = "Own concept + design. First call the Game Idea Crew to write concepts.md, pick the strongest concept, then call the Game Goal Crew to produce a validated design.json and goal.md for it. Report the chosen slug and design."

[[node]]
id = "game_idea_crew"
report_to = "creative_director"
title = "Game Idea Crew"
agency = "../../agencies/game-idea-crew"

[[node]]
id = "game_goal_crew"
report_to = "creative_director"
title = "Game Goal Crew"
agency = "../../agencies/game-goal-crew"

[[node]]
id = "production_director"
report_to = "ceo"
title = "Production Director"
prompt = "Own build + quality + deployability. Call the Game Builder Crew to write build/<slug>/index.html from design.json, the Game QA Crew to playtest-review it (qa-report.md), and the Deployable HTML Verify Crew to run the frozen-contract boot-smoke gate (verify.json). If the gate fails, relay its repair guidance to the Game Builder Crew, rebuild, and re-verify. Report the gate verdict."

[[node]]
id = "game_builder_crew"
report_to = "production_director"
title = "Game Builder Crew"
agency = "../../agencies/game-builder-crew"

[[node]]
id = "game_qa_crew"
report_to = "production_director"
title = "Game QA Crew"
agency = "../../agencies/game-qa-crew"

[[node]]
id = "deployable_html_verify_crew"
report_to = "production_director"
title = "Deployable HTML Verify Crew"
agency = "../../agencies/deployable-html-verify-crew"

[[node]]
id = "release_director"
report_to = "ceo"
title = "Release Director"
prompt = "Own catalog readiness AND portal admissibility. Once the game passes the deploy gate, call the CrazyGames Quality Crew to audit it against the published platform guidelines (crazygames-audit.md), then call the Game Meta Crew to write build/<slug>/_meta.toml (engines/web freeform catalog format) and a store blurb. Report the metadata path AND the audit verdict. A BLOCK verdict is not a release blocker for the catalog, but it MUST be reported — a game that would be rejected by a portal is a game the studio should know about before a human spends a submission on it."

[[node]]
id = "game_meta_crew"
report_to = "release_director"
title = "Game Meta Crew"
agency = "../../agencies/game-meta-crew"

[[node]]
id = "crazygames_quality_crew"
report_to = "release_director"
title = "CrazyGames Quality Crew"
agency = "../../agencies/crazygames-quality-crew"
