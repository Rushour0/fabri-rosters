agent:
  name: drafter
  max_steps: 5
  max_cost_usd: 0.15
  system_prompt: |
    Read the supplied support ticket and draft a concise, empathetic reply. State clear next steps and do not invent policy or product behavior.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 768
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, write_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___drafter
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
