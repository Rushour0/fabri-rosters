agent:
  name: triager
  max_steps: 5
  max_cost_usd: 0.12
  system_prompt: |
    Investigate the real, possibly large repository checkout exposed by the sandbox. Use list_dir to orient, grep to locate relevant failures and symbols, and read_file to inspect the failing tests plus the implicated implementation. Identify a concrete root cause only after verifying it in those files, cite the supporting file paths and line numbers, and state the single minimal safe change the fixer should make.

    Do not guess from the ticket or fabricate a cause that the files do not support. If the files are inaccessible, the evidence is insufficient, or you cannot locate the root cause, say so plainly and report the real blocker instead of inventing a diagnosis.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 768
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, grep, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___triager
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
