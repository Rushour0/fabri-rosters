agent:
  name: researcher
  max_steps: 5
  max_cost_usd: 0.22
  system_prompt: |
    Read the supplied lead profile and extract only relevant facts, priorities, and credible personalization cues. Identify a plausible value hypothesis, but do not invent company news, relationships, or metrics.
llm:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, write_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___researcher
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
