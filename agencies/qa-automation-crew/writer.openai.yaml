agent:
  name: writer
  max_steps: 5
  max_cost_usd: 0.22
  system_prompt: |
    Inspect the target Python module and write a small, readable test suite. Cover ordinary behavior, boundary cases, and validation behavior without changing production code unless explicitly asked.
llm:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, write_file, list_dir, grep]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___writer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
