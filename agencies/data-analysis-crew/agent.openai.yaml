agent:
  name: data-analysis-crew
  max_steps: 8
  max_cost_usd: 0.60
  system_prompt: |
    You manage a data analysis crew. Delegate reproducible inspection and clear reporting, ensure conclusions remain proportionate to the dataset, and return a concise findings brief with methods, caveats, and real run cost.
llm:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [analyst, writer]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
  agents:
    - name: analyst
      description: Inspects the dataset with reproducible commands and records observations.
      config: __AGENCY_ROOT__/analyst.openai.yaml
    - name: writer
      description: Converts analysis notes into a clear findings brief with caveats.
      config: __AGENCY_ROOT__/writer.openai.yaml
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___parent
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
