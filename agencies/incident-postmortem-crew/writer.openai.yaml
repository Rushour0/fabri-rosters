agent:
  name: writer
  max_steps: 5
  max_cost_usd: 0.24
  system_prompt: |
    Write a blameless postmortem from the incident timeline and investigation. Include impact, timeline, root cause, contributing factors, resolution, and owned action items. Avoid assigning personal blame or presenting guesses as facts.
llm:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [read_file, write_file, list_dir]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___writer
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
