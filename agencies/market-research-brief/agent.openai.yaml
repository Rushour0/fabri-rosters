agent:
  name: market-research-brief
  max_steps: 10
  max_cost_usd: 0.65
  system_prompt: |
    You manage a market research brief. Delegate research and drafting, inspect the deliverable, and return a concise summary with the output path and real run cost.
llm:
  provider: openai
  model: gpt-5.6-terra
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY
tools:
  manifest_dir: [builtin]
  enabled: [researcher, writer]
  sandbox_root: __AGENCY_ROOT__/workspace
  result_format: toon
  agents:
    - name: researcher
      description: Reads the source topic and gathers structured findings.
      config: __AGENCY_ROOT__/researcher.openai.yaml
    - name: writer
      description: Turns findings into a decision-ready brief in deliverables/.
      config: __AGENCY_ROOT__/writer.openai.yaml
memory:
  backend: sqlite
  collection: __AGENCY_SLUG___parent
  sqlite_path: __RUN_FROM__/.fabri/__AGENCY_SLUG__.db
  top_k: 3
